version: '3.8'

services:
  postiz:
    image: postiz/postiz:latest
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postiz:postiz@db:5432/postiz
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=my-super-secure-key-2024-make-this-very-long-and-random
      - PUBLIC_URL=http://localhost:5000
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postiz
      - POSTGRES_PASSWORD=postiz
      - POSTGRES_DB=postiz
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  uploads:
  postgres_data:
  redis_data: