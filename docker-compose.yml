version: "3.8"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz:latest
    restart: always
    ports:
      - "80:5000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz
      POSTGRES_DB: postiz
    volumes:
      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
